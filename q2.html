<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <input type="text" id="userInput" placeholder="Enter a number">
    <button onclick="checkInput()">Check</button>
    <script>
        function checkInput() {

            var number = document.getElementById("userInput").value;

            if (number === "" || isNaN(number)) {
                alert("Please insert a number!");
            }
            else if (number < 10) {
                alert("The number is less than 10.");
            } else if (number > 10) {
                alert("The number is greater than 10.");
            } else {
                alert("The number is equal to 10.");
            }
        }
    </script>

</body>

</html>
